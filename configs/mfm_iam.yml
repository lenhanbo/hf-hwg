device: cuda
dataset: iam_word
seed: 123456
huggingface:
  upload_after_training: true
  repo_id: lenhanbo/mfm_checkpoint
  filename: latest.pth

training:
  dset_split: trnval
  batch_size: 64
  num_workers: 4
  epochs: 100

  lr: 1.0e-4
  min_lr: 1.0e-6
  warmup_lr: 1.0e-6
  warmup_epochs: 5

  weight_decay: 0.05
  grad_clip: 3.0

  optimizer:
    name: adamw
    eps: 1.0e-8
    betas: [0.9, 0.999]

  lr_scheduler:
    name: cosine

  low_pass_radius_ratio: 0.10
  high_pass_radius_ratio: 0.10
  low_pass_probability: 0.5

  output_dir: runs/mfm_multitask_iam
  save_every: 10
  print_every: 20
  resume: ""

multitask:
  n_class: 81
  n_writer: 339
  lambda_ocr: 0.01
  lambda_writer: 0.01

SharedBackbone:
  resolution: 16
  max_dim: 256
  in_channel: 1
  dropout: 0.0
  norm: bn


evaluation:
  enabled: true
  split: test
  every: 5

  batch_size: 16
  num_workers: 4
  seed: 123456

  compute_fid: true
  compute_kid: true
  compute_hwd: true

  cache_dir: runs/mfm_multitask_iam/evaluation_cache

  fid_kid:
    dims: 2048
    mmd_degree: 3
    mmd_gamma: null
    mmd_coef0: 1.0
    mmd_subsets: 50
    mmd_subset_size: 1000
    mmd_var: true
